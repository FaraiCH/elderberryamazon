version: '3.8'

services:
    web:
        build: .
        container_name: ubuntu-php-web
        ports:
            - "8001:80"
        volumes:
            - .:/var/www/html
        depends_on:
            - db
        environment:
            - DB_HOST=db
            - DB_DATABASE=btindustrial_dev
            - DB_USERNAME=farai
            - DB_PASSWORD=@Paradice1

    db:
        image: mysql:5.7
        container_name: ubuntu-php-db
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: btindustrial_dev
            MYSQL_USER: farai
            MYSQL_PASSWORD: '@Paradice1'
        volumes:
            - db_data:/var/lib/mysql
            - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
        ports:
            - "3307:3306"

volumes:
    db_data:
