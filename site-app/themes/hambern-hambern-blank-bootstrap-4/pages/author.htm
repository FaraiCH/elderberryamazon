[contactForm]
==
{% put styles %}
	<style type="text/css">
		@media screen and (min-width: 992px) {
		  div.contactForm .form-group{
		  	clear: both;
		  	margin-top: 20px;

		  }

		  div.contactForm .control-label{
		  	float: left !important;
		  	width: 50%;

		  }

		  div.contactForm .form-control{
		  	float: left !important;
		  	width: 50%;
		  	margin-bottom: 15px;
		  }

		}
	</style>
{% endput %}

							{% component 'contactForm' %}
