    <div class="container">
        <h2>Bag Details</h2>
        <form id="bag_details">
        	<div class="form-group">
            <label for="bags">Bag Number:</label>
            <input type="text" id="bags" name="bags" readonly>
        </div>
        <div class="form-group">
            <label for="batchNumber">Batch Number:</label>
            <input type="text" id="batchNumber" name="batchNumber" readonly>
        </div>
        <div class="form-group">
            <label for="batchPrefix">Batch Prefix:</label>
            <input type="text" id="batchPrefix" name="batchPrefix" readonly>
        </div>
        <div class="form-group">
            <label for="actual_weight">Actual Weight:</label>
            <input type="text" id="actual_weight" name="actual_weight">
        </div>
        <!-- Add more fields for other bag details as needed -->
        <button >Save and Close</button>
        </form>
        
    </div>

    <script>
    	var saveActualWeightUrl = "{{ 'save-actual-weight'}}";
        // Function to populate form fields with bag details
        function populateForm() {
            var urlParams = new URLSearchParams(window.location.search);
            var bagNumber = urlParams.get('bags');
            var batchNumber = urlParams.get('batchNumber');
            var batchPrefix = urlParams.get('batchPrefix');

            document.getElementById('bags').value = bagNumber;
            document.getElementById('batchNumber').value = batchNumber;
            document.getElementById('batchPrefix').value = batchPrefix;
        }

        // Function to save actual weight and close the window
        function saveAndClose() {
            var actualWeight = document.getElementById('actual_weight').value;
            var batchNumber = document.getElementById('batchNumber').value;
            var bagNumber = document.getElementById('bags').value;

           

            
        }

        document.querySelector('#bag_details').addEventListener('submit', function(e){
        	e.preventDefault()

        	const formData = new FormData(e.target)
        	const batchNumber = formData.get('batchNumber')
        	fetch(`https://bailaerp.bt-industrial.co.za/save-actual-weight/${batchNumber}`,
            	{method:'post', body: formData}
            )
             .then(response => {
            if (!response.ok) {
                throw new Error('Failed to save actual weight');
            }
            // Display success message
            alert('Actual Weight is saved successfully');
            // Refresh the page
            location.reload();
            })
            .catch(error => {
                console.error('Failed to save actual weight:', error);
                alert('Failed to save actual weight. Please try again.');
            });
        })

        // Populate the form fields when the page loads
        window.onload = populateForm;
    </script>
