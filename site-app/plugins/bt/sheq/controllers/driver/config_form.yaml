# ===================================
#  Form Behavior Config
# ===================================

# Record name
name: Driver

# Model Form Field configuration
form: $/bt/sheq/models/driver/fields.yaml

# Model Class name
modelClass: Bt\Sheq\Models\Driver

# Default redirect location
defaultRedirect: bt/sheq/driver

# Create page
create:
    title: backend::lang.form.create_title
    redirect: bt/sheq/driver/update/:id
    redirectClose: bt/sheq/driver

# Update page
update:
    title: backend::lang.form.update_title
    redirect: bt/sheq/driver
    redirectClose: bt/sheq/driver

# Preview page
preview:
    title: backend::lang.form.preview_title
