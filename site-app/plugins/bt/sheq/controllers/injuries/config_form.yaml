# ===================================
#  Form Behavior Config
# ===================================

# Record name
name: Injury

# Model Form Field configuration
form: $/bt/sheq/models/injuries/fields.yaml

# Model Class name
modelClass: Bt\SHEQ\Models\Injuries

# Default redirect location
defaultRedirect: bt/sheq/injuries

# Create page
create:
    title: Create Injury
    redirect: bt/sheq/injuries/update/:id
    redirectClose: bt/sheq/injuries

# Update page
update:
    title: Edit Injury
    redirect: bt/sheq/injuries
    redirectClose: bt/sheq/injuries

# Preview page
preview:
    title: Preview Injury
