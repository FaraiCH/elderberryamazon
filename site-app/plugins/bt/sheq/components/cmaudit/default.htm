{% if CmAudit.dtimer == 0 %}
<div class="card text-center" style="margin-bottom: 20px">
    <div class="card-header">
        <h2>No Upcoming Audits</h2>
    </div>
</div>
{% endif %}


{% for item in CmAudit.data  %}


 		<div class="card text-center" style="margin-bottom: 20px">
		  <div class="card-header">
		    <h2>{{item.company}} </h2>
		  </div>
		  <div class="card-body">

		    <p class="card-text" style="font-size: 18px">{{item.notes|nl2br}}</p>
		     <p class="card-text text-muted" style="font-size: 18px;" >Date: <b>{{item.auditdate}}</b></p>

		  </div>
		  <div class="card-footer text-muted">
		    <div class="countdown" style="font-weight: bold; font-size: 35px; color: #ea2121; padding-bottom: 0px">
				<span id="clock_{{item.id}}"></span>
	        </div>
		  </div>
		</div>


         {% put scripts %}
        <script type="text/javascript">
		$(document).ready(function () {
			$('#clock_{{item.id}}').countdown('{{item.auditdate}}')
			.on('update.countdown', function(event) {
				var format = '%H:%M:%S';
				if(event.offset.totalDays > 0) {
					format = '%-d day%!d ' + format;
				}
				if(event.offset.weeks > 0) {
					format = '%-w week%!w ' + format;
				}
				$(this).html(event.strftime(format));
			})
			.on('finish.countdown', function(event) {
				$(this).html('This offer has expired!')
				.parent().addClass('disabled');

			});
		});
		</script>
		{% endput %}

 {% endfor%}

 {% put scripts %}
 	    <script type="text/javascript" src="{{ 'assets/vendor/jquery.countdown-2.0.4/jquery.countdown.min.js'|theme }}"></script>



 {% endput %}
