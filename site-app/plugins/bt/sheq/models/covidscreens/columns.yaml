# ===================================
#  List Column Definitions
# ===================================

columns:
    id:
        label: ID
        searchable: true
    capturedate:
        label: Date
    no_screen: 
        label: Employees Screened
        type: Number    
    potential_infection:
        label: Employees who declared symptoms
        type: Number
    no_infected:
        label: Employees Infected
        type: Number
    highest_temperature:
        label: Highest Temperature
        type: Number
        
    notes:
        label: Notes

    createdby:
        label: Create By
        searchable: true
        relation: createdby
        select: concat(first_name, ' ', last_name)
    updatedby:
        label: Updated By
        searchable: true
        relation: updatedby
        select: concat(first_name, ' ', last_name)
    created_at:
        label: Date Created
        format: d-m-Y
        type: date
        invisible: true
    updated_at:
        label: Date Updated
        format: d-m-Y
        type: date
        invisible: true