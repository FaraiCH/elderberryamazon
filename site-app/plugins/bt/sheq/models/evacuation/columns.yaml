columns:
    id:
        label: ID
        searchable: true
    date:
        label: Date of Drill
    comment:
        label: Comments
    createdby:
        label: Create By
        searchable: true
        relation: createdby
        select: concat(first_name, ' ', last_name)
    updatedby:
        label: Updated By
        searchable: true
        relation: updatedby
        select: concat(first_name, ' ', last_name)
