# ===================================
#  List Column Definitions
# ===================================

columns:
    id:
        label: ID
        searchable: true
   

    folder:
      label: Department
      relation: mainfolder
      searchable: true
      select: name
    subfolder:
      label: Folder
      relation: subfolder
      searchable: true
      select: name
    name:
        label: Document Name
        searchable: true
    summary:
        label: Document Summary
        searchable: true
        invisible: true
    assinged_date:
        label: Date In Relation
        
    files_count:
      label: Att Files 
      relation: files
      useRelationCount: true
    images_count:
      label: Att Images 
      relation: images
      useRelationCount: true
      invisible: true
    createdby:
        label: Create By
        searchable: true
        relation: createdby
        select: concat(first_name, ' ', last_name)
    updatedby:
        label: Updated By
        searchable: true
        relation: updatedby
        select: concat(first_name, ' ', last_name)
    created_at:
        label: Date Created
        format: d-m-Y
        type: date
        invisible: true
    updated_at:
        label: Date Updated
        format: d-m-Y
        type: date
        invisible: true
