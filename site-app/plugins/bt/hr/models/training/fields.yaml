# ===================================
#  Form Field Definitions
# ===================================

fields:
    # id:
    #     label: ID
    #     disabled: true
    #     span: auto

    employee:
        label: Employee
        disabled: false
        select: concat(firstname,' ', lastname)
        type: relation
        span: auto

    training_date:
        label: Training Date
        type: datepicker
        tab: General
        span: auto
    type:
        label: type
        disabled: false
        select: name
        type: relation
        span: auto
    notes:
        label: Notes
        type: textarea
        span: auto
        size: small
    files:
            label: Files
            type: fileupload
            tab: Termination
            mode: file
            comment: Any files related to training