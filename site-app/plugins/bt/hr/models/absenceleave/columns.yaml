    employee:
        label: Employee
        select: concat(firstname,' ', lastname)
        relation: employee
    status:
        label: Status
        select: name
        relation: status
    days:
        label: Days Used
    type:
        label: Type
        select: name
        relation: type
        span: auto
    start_date:
        label: Start Date
    end_date:
        label: End Date
    notes:
        label: Notes
