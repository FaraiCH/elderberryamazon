# ===================================
#  List Column Definitions
# ===================================

columns:
    # id:
    #     label: ID
    #     searchable: true
    date:
        label: Date
    name:
        label: Name
    version:
        label: Version Number
    reatedby:
        label: Create By
        searchable: true
        relation: createdby
        select: concat(first_name, ' ', last_name)
        invisible: true
    updatedby:
        label: Updated By
        searchable: true
        relation: updatedby
        select: concat(first_name, ' ', last_name)
        invisible: true
    created_at:
        label: Date Created
        format: d-m-Y
        type: date
        invisible: true
    updated_at:
        label: Date Updated
        format: d-m-Y
        type: date
        invisible: true

