# ===================================
#  Form Field Definitions
# ===================================

fields:
    # id:
    #     label: ID
    #     disabled: true
    #     span: auto

    employee:
        label: Employee
        disabled: false
        select: concat(firstname,' ', lastname)
        type: relation
        span: auto

    incident_date:
        label: Incident Date
        type: datepicker
        mode: date
        span: auto
    status:
        label: Status
        disabled: false
        select: name
        type: relation
        span: auto
    incident:
        label: Incident
        type: textarea
        span: auto
        size: small

    solution:
        label: Solution
        type: textarea
        span: auto
        size: small

    files:
            label: Files
            type: fileupload
            tab: Termination
            mode: file
            comment: Any files related to the incident. E.g Warning Latter, Evidence, Ect 