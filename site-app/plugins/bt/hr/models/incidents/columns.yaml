# ===================================
#  List Column Definitions
# ===================================

columns:
    # id:
    #     label: ID
    #     searchable: true
    employee:
        label: Employee
        select: concat(firstname,' ', lastname)
        relation: employee

    incident_date:
        label: Incident Date
    status:
        label: Status
        select: name
        relation: status

    createdby:
        label: Create By
        searchable: true
        relation: createdby
        select: concat(first_name, ' ', last_name)
    updatedby:
        label: Updated By
        searchable: true
        relation: updatedby
        select: concat(first_name, ' ', last_name)
    created_at:
        label: Date Created
        format: d-m-Y
        type: date
        invisible: true
    updated_at:
        label: Date Updated
        format: d-m-Y
        type: date
        invisible: true