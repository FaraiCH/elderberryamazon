
# ===================================
#  Form Field Definitions
# ===================================

fields:
    # id:
    #     label: ID
    #     disabled: true
    idno:
        label: ID Number
        type: number
        span: auto

    company:
        label: Project Name or Company
        type: relation
        select: name
        span: auto

    employeenumber:
        label: Employee Number
        span: auto
    firstname:
        label: First Name
        span: auto

    secondname:
        label: Second Name
        span: auto
    lastname:
        label: Last Name
        span: auto

    email:
        label: Email
        type: email
        span: auto
    gender:
        label: Gender
        type: dropdown
        span: auto
        placeholder: -- Choose Gender --
        options:
            0: Male
            1: Female
    ethnicity:
        label: Ethnicity
        span: auto
        type: relation
        placeholder: -- Select Ethnicity --
        select: name
    tvorder:
        label: TV Order
        type: number
        span: auto
    pay_roll:
        label: Payroll
        type: dropdown
        span: auto
    pay_roll_type:
        label: Pay Roll Type
        type: dropdown
        span: auto
        placeholder: -- Select A Pay Roll Type --
        options:
            0: None
            1: Monthly
            2: Fortnight
    is_user_active:
        label: Is User active?
        type: switch
        on: Yes
        off: No
        span: auto
    showontv:
        label: Show On TV
        type: switch
        span: auto
    is_emergency:
        label: Is Employee Emergency?
        type: switch
        on: Yes
        off: No
        span: auto







