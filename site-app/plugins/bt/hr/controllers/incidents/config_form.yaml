# Record name
name: Incident

# Model Form Field configuration
form: $/bt/hr/models/incidents/fields.yaml

# Model Class name
modelClass: Bt\HR\Models\Incidents

# Default redirect location
defaultRedirect: bt/hr/incidents

# Create page
create:
    title: Create Incident
    redirect: bt/hr/incidents/update/:id
    redirectClose: bt/hr/incidents

# Update page
update:
    title: Edit Incident
    redirect: bt/hr/incidents
    redirectClose: bt/hr/incidents

# Preview page
preview:
    title: Preview Incident
