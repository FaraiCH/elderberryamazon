# ===================================
#  Form Behavior Config
# ===================================

# Record name
name: Profile

# Model Form Field configuration
form: $/bt/hr/models/profile/fields.yaml

# Model Class name
modelClass: Bt\HR\Models\Profile

# Default redirect location
defaultRedirect: bt/hr/profile

# Create page
create:
    title: Create Profile
    redirect: bt/hr/profile/update/:id
    redirectClose: bt/hr/profile

# Update page
update:
    title: Edit Profile
    redirect: bt/hr/profile
    redirectClose: bt/hr/profile

# Preview page
preview:
    title: Preview Profile
