

<div class="control-section">
    <div class="content-wrapper">
        <div class="form-group " style="padding-top: 24px">
<!--            <a href="/admin/bt/hr/export/wagebill"-->
<!--               class="btn btn-primary oc-icon-download">-->
<!--                Export Wages-->
<!--            </a>-->
        </div>
        <div id="Grid">
        </div>
    </div>
</div>

<script>
    var grid = new ej.grids.Grid({
        gridLines: 'Both',
        dataSource: [],
        frozenColumns: 6,
        enableStickyHeader: true,
        allowExcelExport: true,
        toolbar: ['ExcelExport', 'Search'],
        height: '100%',
        allowPaging: true,
        allowFiltering: true,
        allowSorting: true,
        created: () => {
            document.getElementById(grid.element.id + "_searchbar").addEventListener('keyup', () => {
                grid.search(event.target.value)
            });
        },
        columns: <?= $columns ?>,

    });
    grid.toolbarClick = function(args){
        if (args['item'].id === 'Grid_excelexport') {
            let excelExportProperties = {
                fileName:"Wage Bill Hours.xlsx"
            };
            grid.excelExport(excelExportProperties);
        }
    }

    grid.excelQueryCellInfo = (args) => {
        if(args.column.field.includes('totalHrs') || args.column.field.includes('totalNormal') || args.column.field.includes('timeAndHalf') || args.column.field.includes('totalDouble') || args.column.field.includes('totalSickLeave')
        || args.column.field.includes('totalAnualLeave') || args.column.field.includes('totalPublic')){
            args.style = {backColor: '#FFA500'};

        }

        if(args.column.field.includes('randT') || args.column.field.includes('randTandHalf') || args.column.field.includes('rand2T') || args.column.field.includes('shiftallowance') || args.column.field.includes('fullAmount')
            || args.column.field.includes('randAnnual') || args.column.field.includes('randSick') || args.column.field.includes('randPublic')){
            args.style = {backColor: '#FFFFED'};

        }

    }

    grid.appendTo('#Grid');

    $.ajax({
        url: '/update-employees/',
        method: 'POST',
        async: true,
        success: function (data) {
            // Removing double quotes from numbers in the array
            const modifiedDataArray = data.map(obj => {
                Object.keys(obj).forEach(key => {
                    if (!isNaN(obj[key])) {
                        obj[key] = parseFloat(obj[key]);
                    }
                });
                return obj;
            });
            grid.dataSource = modifiedDataArray;
        },
    });
</script>
