<div class="col-xs-12 col-sm-12 col-lg-12 col-md-12">
    <!--element which is going to render the Card-->
    <div tabindex="0" class="e-card" id="basic">
        <div class="e-card-header">
            <div class="e-card-header-caption">
                <div style="color: white" class="e-card-header-title">WAGE BILL IMPLEMENTATION</div>
            </div>
        </div>
        <div class="e-card-content">
            <form name="form-check" id="form-check">
                <label for="employeedrop">Choose an employee to capture for.</label>
                <input required style="width: 100%" type="text" id="employeedrop" name="employeedrop" tabindex="1" />
                <br>
                <br>
                <label for="startdate">Choose a date. This is the start date of capturing. If you do not input a date, today's date will be chosen.</label>
                <input required style="width: 100%" type="text" id="startdate" name="startdate"/>
                <br>
                <br>
                <label for="weekno">How many days do you want to input? 14 Days is for fortnight. You can choose as many days as you want.</label>
                <input required style="width: 100%" type="text" id="weekno" name="weekno" tabindex="1" />
                <br>
                <br>
                <input required style="width: 100%" id="normally" name="normally" tabindex="1" value="" />
                <label for="newshift">What shift has this employee worked?</label>
                <td style="background: #f9efad">
                    <div class="form-group dropdown-field">
                        <select onload="checkName()"  name="newshift" id="newshift" class="form-control custom-select">
                            <option value="0">Day</option>
                            <option value="1">Night</option>
                        </select>
                    </div>
                </td>
                <br>
                <br>
                <div id="setup" class="text-center">
                    <button
                        type="submit"
                        data-request="onWages"
                        data-toggle="modal"  href="#contentBasic" class="btn btn-primary btn-lg" style="text-align: center; width: 50%">
                        Setup Wage Bill
                    </button>
                </div>
                <div id="emptyemployee" class="text-center">
                    <span class="text text-danger">Please Input Employee To Be Able To Setup The Wage Bill</span>
                </div>

            </form>
        </div>
    </div>
</div>
<div class="control-popup modal fade" id="contentBasic" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" style="width: 90%; height: 90%;">
        <div class="modal-content">
            <div class="modal-body">
                <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
                <div id="wages">
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $('#setup').hide();

    var sportsData = <?= json_encode($employeeall) ?>;

    // initialize AutoComplete component
    var employee = new ej.dropdowns.AutoComplete({
        //set the data to dataSource property
        dataSource: sportsData,
        // set the placeholder to AutoComplete input element
        placeholder: 'Type a name or click the dropdown button',
        showPopupButton: true,
        change: onChange
    });
    employee.appendTo('#employeedrop');

    // initialize AutoComplete component
    var noWeek = new ej.inputs.TextBox({
        placeholder: '1 for the selected date',
        floatLabelType: 'Auto',
        type: 'number',
        value: 14,
        change: onNumber
    });
    noWeek.appendTo('#weekno');

    var normally = new ej.inputs.TextBox({
        floatLabelType: 'Auto',
        type: 'hidden',
        value: 12,
        change: onNumber2
    });
    normally.appendTo('#normally');

    var datepicker = new ej.calendars.DatePicker({
        placeholder: 'Click The Calender Button..',
        // sets the format.
        format: 'yyyy-MM-dd',
        focus: function () {
            // To open the popup upon input click
            datepicker.show();
        },
    });
    datepicker.appendTo('#startdate');

    function onChange(args) {
        $.post('hoursinput', { data: args.element.value});
        $('#setup').hide();
        $('#emptyemployee').show();
        $.request('onCalculate',{data: {value: args.element.value}, success: function(data) {
            $('#setup').show();
            $('#emptyemployee').hide();
            var normally = new ej.inputs.TextBox({
                floatLabelType: 'Auto',
                type: 'number',
                value: data.result,
                change: onNumber2
            });
            normally.appendTo('#normally');
        }});
    }
    function onNumber(args){
        var employee = document.getElementById("employeedrop").value;
        if(args.value && employee){
            $('#setup').show();
            $('#emptyemployee').hide();
        }else{
            $('#setup').hide();
            $('#emptyemployee').show();
        }
    }
    function onNumber2(args){
        var employee = document.getElementById("employeedrop").value;
        if(args.value && employee){
            $('#setup').show();
            $('#emptyemployee').hide();
        }else{
            $('#setup').hide();
            $('#emptyemployee').show();
        }
    }
    var options = {
        rules: {
            'employeedrop': { required: true },
            'startdate': { required: true },
            'weekno': { required: true },

        }
    }
    var formObject = new ej.inputs.FormValidator('#form-check', options);
</script>
