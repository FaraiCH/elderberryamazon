# ===================================
#  Form Behavior Config
# ===================================

# Record name
name: Department

# Model Form Field configuration
form: $/bt/hr/models/department/fields.yaml

# Model Class name
modelClass: Bt\HR\Models\Department

# Default redirect location
defaultRedirect: bt/hr/department

# Create page
create:
    title: Create Department
    redirect: bt/hr/department/update/:id
    redirectClose: bt/hr/department

# Update page
update:
    title: Edit Department
    redirect: bt/hr/department
    redirectClose: bt/hr/department

# Preview page
preview:
    title: Preview Department
