# ===================================
#  List Column Definitions
# ===================================

columns:
    id:
        label: ID
        searchable: true
    isolved:
        label: Is Solved?
        type: switch
    created_at:
        label: Date Created
        format: d-m-Y
        type: date
    subject:
        label: Subject
        searchable: true
  
    createdby:
        label: Create By
        searchable: true
        relation: createdby
        select: concat(first_name, ' ', last_name)
    updatedby:
        label: Updated By
        searchable: true
        relation: updatedby
        select: concat(first_name, ' ', last_name)
        invisible: true
    
    updated_at:
        label: Date Updated
        format: d-m-Y
        type: date
        invisible: true