# ===================================
#  List Column Definitions
# ===================================

columns:
    name:
        label: parent folder
        searchable: true
        sortable: true
    folder_count:
        label: Sub Folders
        relation: subcategory
        useRelationCount: true
    ducuments_count:
        label: Documents
        relation: documents
        useRelationCount: true
    createdby:
        label: Create By
        searchable: true
        relation: createdby
        select: concat(first_name, ' ', last_name)
    updatedby:
        label: Updated By
        searchable: true
        relation: updatedby
        select: concat(first_name, ' ', last_name)
