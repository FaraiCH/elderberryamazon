# ===================================
#  List Column Definitions
# ===================================

columns:
    id:
        label: ID
        searchable: true

    employee:
        label: User Name
        relation: employee
        select: CONCAT(employeenumber,' - ', firstname,' ', lastname)
        searchable: true
        sortable: true

    assettype:
        label: Asset
        relation: asset
        select: CONCAT(assettype,' - ', brand)
        searchable: true
        sortable: true

    serialnum:
        label: Serial Number
        type: text

    post-damage:
        label: Post-Damage
        type: switch
        on: Yes
        off: No
    pre-damage:
        label: Pre-Damage
        type: switch
        on: Yes
        off: No

    dateissue:
        label: Date Issued
        type: date
        mode: date
        searchable: true
        sortable: true

    date-return:
        label: Date Returned
        type: date
        mode: date 

    updatedby:
        label: Updated By
        searchable: true
        relation: updatedby
        select: concat(first_name, ' ', last_name)
        # invisible: true

    createdby:
        label: Create By
        searchable: true
        relation: createdby
        select: concat(first_name, ' ', last_name)
        invisible: true