# ===================================
#  List Column Definitions
# ===================================

columns:
    id:
        label: ID
        searchable: true
    brand:
        label: brand
        type: text
        sortable: true
        searchable: true
    assettype:
        label: assert type
        type: text
        sortable: true
        searchable: true
    specification:
        label: specification
        type: text
    quantity:
        label: quantity
        type: number
    haswarranty:
        label: has-warranty
        type: switch
    description:
        label: description
        type: number

    createdby:
        label: Create By
        searchable: true
        relation: createdby
        select: concat(first_name, ' ', last_name)
    updatedby:
        label: Updated By
        searchable: true
        relation: updatedby
        select: concat(first_name, ' ', last_name)
