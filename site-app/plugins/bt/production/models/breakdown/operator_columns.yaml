# ===================================
#  List Column Definitions
# ===================================

columns:
    id:
        label: ID
        searchable: true
    btline:
        label: Line
        relation: btline
        select: name
        searchable: true
    startdate:
      label: Start Date and Time
    breakdown:
      label: Breakdown Reasons
      relation: breakdown
      select: name
      searchable: true
    jobcard:
        label: Maintenance Jobcard
        type: number
        select: jobcard_id
        searchable: true
    status_jobcard:
        label: Status
        type: partial
        path: $/bt/production/models/breakdown/_status_column.htm
    age:
        label: Breakdown Age
        type: partial
        path: $/bt/production/models/breakdown/_age_column.htm
    controlsheets:
      label: Control Sheet
      relation: controlsheets
      select: id
      searchable: true
    createdby:
        label: Create By
        searchable: true
        relation: createdby
        select: concat(first_name, ' ', last_name)
    updatedby:
        label: Updated By
        searchable: true
        relation: updatedby
        select: concat(first_name, ' ', last_name)
        invisible: true
    created_at:
        label: Date Created
        format: d-m-Y
        type: date
    updated_at:
        label: Date Updated
        format: d-m-Y
        type: date
        invisible: true