# ===================================
#  Form Field Definitions
# ===================================

fields:

    btline:
      label: Production Line
      select: name
      type: relation
      span: auto
      placeholder: -- select a Production Line --

    plan:
        label: Select Production Plan
        span: auto
        type: dropdown
        dependsOn: btline
        placeholder: Please Select Plan
    planitem:
        label: Select pipe to run under selected plan
        span: auto
        type: dropdown
        placeholder: Please Select Plan Item
        dependsOn: plan
    raw_plan:
        label: Raw Production Plan
        span: auto
        type: dropdown
        placeholder: -- Choose Raw Production Plan --
        dependsOn: btline
    shift:
      label: Shift
      span: auto
      type: dropdown
      placeholder: -- select a shift --
      options:
          DAY: DAY
          NIGHT: NIGHT

    batch@update:
      label: Batch
      type: dropdown
      dependsOn: jobcard_id
      span: auto
    batch@create:
      label: Batch
      select: concat('Jobcard-',jobcard_id,'-',id)
      type: dropdown
      dependsOn: jobcard_id
      span: auto
      placeholder: -- select a batch --

    # target_num_pipes:
    #   label: Target of Pipes To Produce
    #   type: Number
    #   span: auto
    opendate:
      label: Open Date and Time
      type: datepicker
      span: auto
      ignoreTimezone: true
    assignedto:
      label: Operator Name
      select: name
      type: relation
      span: auto
      placeholder: -- select a Operator --


    active:
        label: Is Active
        type: switch
        span: auto
        off: No
        on: Yes

tabs:
  fields:

    standardweight@update:
      label: Standard Weight
      span: auto
      # comment: Pull from quote/Automate - weight
      tab: Run Setup

    mass@update:
      label: Mass/Meter
      span: auto
      # comment: Pull from quote/Automate - totalweight
      tab: Run Setup

    pipesize@update:
      label: Pipe Size
      span: auto
      #comment: product > diameters > 16 + mm
      tab: Run Setup
    pipelenght@update:
      label: Pipe Lenght
      span: auto
      #comment: Pull from quote/Automate - unitlnght
      tab: Run Setup
    rawmaterialpe:
      label: Rawmaterial PE
      span: auto
      default: PE 100
      tab: Run Setup



    maxwall@update:
      label: Max Wall
      span: auto
      tab: Run Setup
    minwall@update:
      label: Min Wall
      span: auto
      tab: Run Setup
    avrwall@update:
      label: Avr Wall
      span: auto
      tab: Run Setup
    pipeod@update:
      label: Pipe OD
      span: auto
      tab: Run Setup
    ovality@update:
      label: ovality
      span: auto
