            0: No
            1: Yes
            2: Exceeded Spec
    actual_pipeod:
      label: Actual Pipe OD
      span: storm
      cssClass: col-md-3
      tab: Control Sheet
    od_comply:
        label: Pipe Diameter Comply
        type: dropdown
        span: storm
        tab: Control Sheet
        cssClass: col-md-3
        options:
            0: No
            1: Yes
            2: Exceeded Spec

    ponumber:
        label: PO Number
        tab: Control Sheet
        span: storm
        cssClass: col-md-3
    total_weight:
        label: Lab Weight
        tab: Control Sheet
        type: number
        span: storm
        cssClass: col-md-3
