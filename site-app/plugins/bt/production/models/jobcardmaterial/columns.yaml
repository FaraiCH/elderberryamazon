# ===================================
#  List Column Definitions
# ===================================

columns:
    id:
        label: ID
        searchable: true
    productname:
        label: Product Name
        type: partial
        path: $/bt/production/models/jobcardmaterial/_productname_column.htm
    batch:
        label: Batch
        relation: recieve
        select: supplier_batch
    kg:
        label: kg
        type: number
        format: "%.1f kg"
    note:
        label: Comments
    createdby:
        label: Create By
        searchable: true
        relation: createdby
        select: concat(first_name, ' ', last_name)
    updatedby:
        label: Updated By
        searchable: true
        relation: updatedby
        select: concat(first_name, ' ', last_name)
    created_at:
        label: Date Created
        format: d-m-Y
        type: date
        invisible: true
    updated_at:
        label: Date Updated
        format: d-m-Y
        type: date
        invisible: true
