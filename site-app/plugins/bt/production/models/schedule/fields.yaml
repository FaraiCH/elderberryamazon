    assignedto:
        label: Operator Name
        select: name
        type: relation
        cssClass: noezanclass col-sm-6
        span: storm
        placeholder: -- select a Operator --

    shiftno:
        label: Shift No
        cssClass: noezanclass col-sm-6
        span: storm
        type: dropdown
        placeholder: -- select a shift --
        options:
            1: 1st
            2: 2nd
            3: 3rd
            4: 4th
            5: other
    production_days:
            label: Production Day
            disabled: false
            cssClass: noezanclass col-sm-6
            span: storm
            type: number

    target_kg_processed:
        label: Target KG Processed
        disabled: false
        tab: Target
        cssClass: noezanclass col-sm-6
        span: storm
        type: number
    target_units_produced:
        label: Target Units Produced
        disabled: false
        tab: Target
        cssClass: noezanclass col-sm-6
        span: storm
        type: number

    is_stock:
        label: Is Stock Taking?
        type: switch
        span: auto
        on: Yes
        off: No

