# ===================================
#  List Column Definitions
# ===================================

columns:
    id:
        label: ID
        searchable: true
    name:
        label: Delay Reason

    createdby:
        label: Create By
        searchable: true
        relation: createdby
        select: concat(first_name, ' ', last_name)
    updatedby:
        label: Updated By
        searchable: true
        relation: updatedby
        select: concat(first_name, ' ', last_name)
        invisible: true
    created_at:
        label: Date Created
        format: d-m-Y
        type: date
    updated_at:
        label: Date Updated
        format: d-m-Y
        type: date
        invisible: true
