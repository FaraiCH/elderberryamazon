<?php if(isset($test->report)): ?>

<div class="callout fade in callout-warning no-subheader">
    <div class="header">
        <h3 style="text-align: center">The Spreadsheet Function Is Highly Experimental. Saving Is Not Permitted.</h3>
    </div>
</div>
<div id="element"></div>

<script>
    //Initialize Spreadsheet component.
    var spreadsheet = new ej.spreadsheet.Spreadsheet({
        openUrl: 'https://ej2services.syncfusion.com/production/web-services/api/spreadsheet/open',
        saveUrl: 'https://ej2services.syncfusion.com/production/web-services/api/spreadsheet/save',
        created: function () {

            fetch("<?= $test->report->getPath() ?>") // fetch the remote url
                .then((response) => {
                    response.blob().then((fileBlob) => { // convert the excel file to blob
                        var file = new File([fileBlob], "Sample.xlsx"); //convert the blob into file
                        spreadsheet.open({ file: file }); // open the file into Spreadsheet
                    })
                });

        }
    });
    //Render initialized Spreadsheet component.
    spreadsheet.appendTo('#element');

</script>

<?php else: ?>
<div class="callout fade in callout-danger no-subheader">
    <div class="header">
        <h3 style="text-align: center">There IS No Data For This Day. Please Select Another Day.</h3>
    </div>
</div>
<?php endif; ?>
