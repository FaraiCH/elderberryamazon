pipes:
    label: Pipes
    manage:
        form: $/bt/production/models/pipe/fields.yaml
        list: $/bt/production/models/pipe/columns.yaml
    view:
        list: $/bt/production/models/pipe/columns.yaml
        recordUrl: /bt/production/pipe/update/:id
        toolbarButtons: false
        showCheckboxes: false
        showSetup: false
        recordsPerPage: 20
        showSearch: true
        showPageNumbers: true;
productiondelay:
    label: Delay Reasons
    manage:
        form: $/bt/production/models/productiondelay/fields.yaml
        list: $/bt/production/models/productiondelay/columns.yaml
    view:
        list: $/bt/production/models/productiondelay/columns.yaml
        recordUrl: /bt/production/productiondelay/update/:id
        toolbarButtons: create|delete
        showCheckboxes: false
        showSetup: false
approved:
    label: Approve Production
    view:
        list: $/bt/production/models/pipe/columns.yaml
        form: $/bt/production/models/pushapprove/fields.yaml
        toolbarButtons: update
    manage:
        form: $/bt/production/models/pushapprove/fields.yaml
        list: $/bt/production/models/pushapprove/columns.yaml


