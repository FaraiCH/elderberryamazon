# ===================================
#  Form Field Definitions
# ===================================

fields:
    mainfolder:
        label: Department
        type: relation
        select: name
        span: auto
        placeholder: -- select a folder --
        showSearch: false
        comment: After selecting department, **folder field will automatically update
        required: true

    subfolder:
        label: Folder
        type: dropdown
        dependsOn: mainfolder
        span: auto
        emptyOption: -- no sub folder --
        placeholder: -- select a folder --
        showSearch: false
        required: true

    name:
        label: Document Name
        searchable: true
        span: auto
        required: true



    assinged_date:
        label: Date In Relation
        type: datepicker
        mode: date
        span: auto

    summary:
        label: Document Summary
        searchable: true
        # span: auto
        type: richeditor
        toolbarButtons: bold|italic|insertLink
        size: small
tabs:
    fields:
        files:
            label: Upload Files
            type: fileupload
            tab: Files
            mode: file
            comment: Please keep the file size below 3 Megabytes. Anything above that wont be uploaded
        images:
            label: Upload Images
            type: fileupload
            tab: Images
            comment: Please keep the file size below 3 Megabytes. Anything above that wont be uploaded
