scopes:
    department:
        label: Department
        modelClass: Bt\Documents\Models\Category
        conditions: category_id in (:filtered)
        nameFrom: name
    createdby:
        label: Created By
        modelClass: Backend\Models\User
        conditions: created_by in (:filtered)
        nameFrom: first_name

    assinged_date:
        label: Date In Relation
        type: daterange
        conditions: assinged_date >= ':after' AND assinged_date <= ':before'