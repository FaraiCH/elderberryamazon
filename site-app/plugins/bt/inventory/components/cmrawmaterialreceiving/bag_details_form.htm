<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bag Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 3px;
            box-sizing: border-box;
        }
        .form-group button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Bag Details</h2>
        <div class="form-group">
            <label for="bagNumber">Bag Number:</label>
            <input type="text" id="bagNumber" readonly>
        </div>
        <div class="form-group">
            <label for="batchNumber">Batch Number:</label>
            <input type="text" id="batchNumber" readonly>
        </div>
        <div class="form-group">
            <label for="batchPrefix">Batch Prefix:</label>
            <input type="text" id="batchPrefix" readonly>
        </div>
        <!-- Add more fields for other bag details as needed -->
        <button onclick="closeWindow()">Close</button>
    </div>

    <script>
        // Function to populate form fields with bag details
        function populateForm() {
            var urlParams = new URLSearchParams(window.location.search);
            var bagNumber = urlParams.get('bagNumber');
            var batchNumber = urlParams.get('batchNumber');
            var batchPrefix = urlParams.get('batchPrefix');

            document.getElementById('bagNumber').value = bagNumber;
            document.getElementById('batchNumber').value = batchNumber;
            document.getElementById('batchPrefix').value = batchPrefix;
        }

        // Function to close the window
        function closeWindow() {
            window.close();
        }

        // Populate the form fields when the page loads
        window.onload = populateForm;
    </script>
</body>
</html>
