# ===================================
#  List Column Definitions
# ===================================

columns:
    id:
        label: ID
        searchable: true
    requesteddate:
        label: Request Release By Date

    reason:
        label: Reason For Release
        relation: reason
        select: name

    kg:
        label: Weight In Kg
        type: number
        format:  %.1f kg     
    createdby:
        label: Create By
        searchable: true
        relation: createdby
        select: concat(first_name, ' ', last_name)
    created_at:
        label: Create Date
        #type: date
        searchable: true