# ===================================
#  List Column Definitions
# ===================================

columns:
    id:
        label: ID
        searchable: true
    datecaptured:
        label: Date Captured
    weight:
        label: Total Weight (KG)
        type: partial
        path: $/bt/inventory/models/cagematerial/_total_kg.htm
    createdby:
        label: Created By
        searchable: true
        relation: createdby
        select: concat(first_name, ' ', last_name)
    updatedby:
        label: Updated By
        searchable: true
        relation: updatedby
        select: concat(first_name, ' ', last_name)


