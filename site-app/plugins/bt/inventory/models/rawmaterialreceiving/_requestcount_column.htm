<?php
$count = 0;
foreach($record->request as $key=>$value){
    $count += $value->kg;
} 
?>
<?php if($count >= $record->weight): ?>
    <span class="text-danger">
        <?php echo $count; ?> kg
    </span>

<?php else: ?>
    <span class="text-success" >
    <?php echo $count; ?> kg
    </span>
<?php endif; ?>
