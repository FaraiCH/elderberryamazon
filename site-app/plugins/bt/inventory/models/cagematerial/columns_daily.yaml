# ===================================
#  List Column Definitions
# ===================================

columns:

    batch:
        label: Batch Number
        searchable: true
        relation: materialreceiving
        select: supplier_batch
    product:
        label: Product Name
        type: partial
        path: $/bt/inventory/models/cagematerial/_product.htm
    kg:
        label: Weight In Kg
        searchable: true
        type: number
        format:  %.1f kg
    comments:
        label: Comments
    createdby:
        label: Create By
        searchable: true
        relation: createdby
        select: concat(first_name, ' ', last_name)
    updatedby:
        label: Updated By
        searchable: true
        relation: updatedby
        select: concat(first_name, ' ', last_name)
