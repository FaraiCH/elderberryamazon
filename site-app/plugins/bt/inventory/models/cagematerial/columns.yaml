# ===================================
#  List Column Definitions
# ===================================

columns:
    id:
        label: ID
        searchable: true
    datecaptured:
        label: Date
        searchable: true
    # product:
    #     label: Product
    #     searchable: true
    #     relation: productname
    #     select: name
    kg:
        label: Weight In Kg
        searchable: true
        type: number
        format:  %.1f kg 
    createdby:
        label: Create By
        searchable: true
        relation: createdby
        select: concat(first_name, ' ', last_name)
    updatedby:
        label: Updated By
        searchable: true
        relation: updatedby
        select: concat(first_name, ' ', last_name)