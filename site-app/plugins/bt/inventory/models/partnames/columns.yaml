# ===================================
#  List Column Definitions
# ===================================

columns:
    id:
        label: ID
        searchable: true
    category:
        label: Category
        searchable: true
        relation: category
        select: name

    supplier:
        label: Supplier
        searchable: true
        relation: supplier
        select: name
    name:
        label: Product Name
        searchable: true
    createdby:
        label: Create By
        searchable: true
        relation: createdby
        select: concat(first_name, ' ', last_name)
    updatedby:
        label: Updated By
        searchable: true
        relation: updatedby
        select: concat(first_name, ' ', last_name)
