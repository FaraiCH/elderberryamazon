<style>

h1.page-title {
    font-size: 2em;
}

.calendar {
    font-size: 1.3rem;
}

.calendar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.calendar-header .icons{
  display: flex;
}

.calendar-header .icons span{
  height: 38px;
  width: 38px;
  margin: 0 1px;
  cursor: pointer;
  color: #878787;
  text-align: center;
  line-height: 38px;
  font-size: 1.9rem;
  user-select: none;
  border-radius: 50%;
}

.icons span:last-child{
  margin-right: -10px;
}

.calendar-header .icons span:hover{
  background: #f2f2f2;
}

.calendar-header .current-date{
  font-weight: 600;
}

.calendar-weeks,
.calendar-days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
  gap: 1px;
  background-color: #d7e1ea;
    border: 1px solid #d7e1ea;
}

.calendar-days {
    grid-auto-rows: minmax(50px, auto);
}

.calendar-weeks {
    font-weight: 600;
}

.calendar-weeks > * {
    padding: 10px;
    background-color: #d8e2f2;
}

.calendar-days li {
  z-index: 1;
  cursor: pointer;
  position: relative;
}

.calendar-days > a,
.calendar-days > span {
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #fff;
}

.calendar-days > a {
    transition: background-color 0.2s ease-in-out;
    text-decoration: none;
    color: inherit;
}

.calendar-days > span {
    background-color: #f0f4f8;
}

.calendar-days a:hover {
    background-color: #d8e2f2;
}

.calendar-days a.active,
.calendar-days a.active:hover {
    background-color: #3b82f6;
    color: #fff;
}

.calendar-days .inactive{
  color: #aaa;
}

@media (min-width: 768px) {
    .calendar-days {
        grid-auto-rows: minmax(100px, auto);
    }
}

</style>

<div class="calendar">

    <div class="calendar-header">
        <h1 class="page-title" id="current-date"></h1>
        <div class="icons">
          <span id="prev">&larr;</span>
          <span id="next">&rarr;</span>
        </div>
    </div>

    <div class="calendar" id="calendar">
        <div class="calendar-weeks" id="calendar-weeks">
          <div>Sun</div>
          <div>Mon</div>
          <div>Tue</div>
          <div>Wed</div>
          <div>Thu</div>
          <div>Fri</div>
          <div>Sat</div>
        </div>

        <div class="calendar-days" id="calendar-days"></div>
    </div>

</div>

<script>

const calenddaysTag = document.querySelector(".calendar-days");
const currentDate = document.querySelector("#current-date");
const prevNextIcon = document.querySelectorAll(".icons span");

// getting new date, current year and month
let date = new Date();
let currYear = date.getFullYear();
let currMonth = date.getMonth();

// storing full name of all months in array
const months = ["January", "February", "March", "April", "May", "June", "July",
              "August", "September", "October", "November", "December"];

const renderCalendar = () => {
    let firstDayofMonth = new Date(currYear, currMonth, 1).getDay(); // getting first day of month
    let lastDateofMonth = new Date(currYear, currMonth + 1, 0).getDate(); // getting last date of month
    let lastDayofMonth = new Date(currYear, currMonth, lastDateofMonth).getDay(); // getting last day of month
    let lastDateofLastMonth = new Date(currYear, currMonth, 0).getDate(); // getting last date of previous month
    let liTag = "";

    for (let i = firstDayofMonth; i > 0; i--) { // creating li of previous month last calendar-days
        liTag += `<span class="inactive">${lastDateofLastMonth - i + 1}</span>`;
    }

    for (let i = 1; i <= lastDateofMonth; i++) { // creating li of all calendar-days of current month
        // adding active class to li if the current day, month, and year matched
        let isToday = i === date.getDate() && currMonth === new Date().getMonth()
                     && currYear === new Date().getFullYear() ? "active" : "";

        liTag += `<a class="${isToday}" href="productiondailyreport/dailydata?query=${ currYear }-${ (currMonth < 10) ? '0' + currMonth : currMonth }-${ (i < 10) ? '0' + i : i }">${i}</a>`;
    }

    for (let i = lastDayofMonth; i < 6; i++) { // creating li of next month first calendar-days
        liTag += `<span class="inactive">${i - lastDayofMonth + 1}</span>`
    }

    currentDate.innerText = `${months[currMonth]} ${currYear}`; // passing current mon and yr as currentDate text
    calenddaysTag.innerHTML = liTag;
}
renderCalendar();

prevNextIcon.forEach(icon => { // getting prev and next icons
    icon.addEventListener("click", () => { // adding click event on both icons
        // if clicked icon is previous icon then decrement current month by 1 else increment it by 1
        currMonth = icon.id === "prev" ? currMonth - 1 : currMonth + 1;

        if(currMonth < 0 || currMonth > 11) { // if current month is less than 0 or greater than 11
            // creating a new date of current year & month and pass it as date value
            date = new Date(currYear, currMonth, new Date().getDate());
            currYear = date.getFullYear(); // updating current year with new date year
            currMonth = date.getMonth(); // updating current month with new date month
        } else {
            date = new Date(); // pass the current date as date value
        }
        renderCalendar(); // calling renderCalendar function
    });
});

</script>
