# ===================================
#  Form Behavior Config
# ===================================

# Record name
name: Company

# Model Form Field configuration
form: $/bt/jsedata/models/company/fields.yaml

# Model Class name
modelClass: Bt\JSEData\Models\Company

# Default redirect location
defaultRedirect: bt/jsedata/company

# Create page
create:
    title: Create Company
    redirect: bt/jsedata/company/update/:id
    redirectClose: bt/jsedata/company

# Update page
update:
    title: Edit Company
    redirect: bt/jsedata/company
    redirectClose: bt/jsedata/company

# Preview page
preview:
    title: Preview Company
