# ===================================
#  List Column Definitions
# ===================================

columns:
    id:
        label: ID
        searchable: true
    name:
        label: Category name
        searchable: true
    parent:
        label: parent
        relation: parent
        select: name

    altnamea:
        label: altnamea 
        searchable: true
    altnameb:
        label: altnameb 
        searchable: true
    altnamec:
        label: altnamec
        searchable: true
    created_at:
        label: Date Created
        format: d-m-Y
        type: date
        invisible: true
    updated_at:
        label: Date Updated
        format: d-m-Y
        type: date
        invisible: true

    createdby:
        label: Create By
        searchable: true
        relation: createdby
        select: concat(first_name, ' ', last_name)
    updatedby:
        label: Updated By
        searchable: true
        relation: updatedby
        select: concat(first_name, ' ', last_name)