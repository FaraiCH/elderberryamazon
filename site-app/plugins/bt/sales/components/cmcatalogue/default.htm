{% set listentry = CmCatalogue.loadList() %}
{% if listentry is not empty  %}
	{% set total = 0 %}



		<table class="table table-striped table-bordered" id="tabledownload">
				<thead>
					<tr>
						
						<th>#</th>
						<th>Item Name</th>
						<th>Description</th>
						<th>price</th>
					</tr>
				</thead>
				<tbody>
					
			        {% for itemobject in listentry %}					
			        	<tr>
			        		
			        		<td>{{itemobject.id}}</td>
			        		<td>{{itemobject.name}}</td>
			        		<td>{{itemobject.description}}</td>
			              	<td>R {{itemobject.price}}</td>
			              	
			             </tr>
			            
			        {% endfor %} 
		        </tbody>
		      
	        
    </table>
	




{% else %}
<div class="card-body">
	<p>No Items</p>
</div>
{% endif %}
