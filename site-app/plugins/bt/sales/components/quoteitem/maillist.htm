{% set quotes = BTQuoteList.loadQoutes() %}
{% if emails is not empty  %}
	{% set total = 0 %}
		<table class="table table-striped table-bordered" id="tabledownload">
				<thead>
					<tr>
						<th>#</th>
						<th>Date</th>
						<th>Status</th>
						<th>TO</th>
						{#<th>CC</th>#}
						<th>Notes</th>
					</tr>
				</thead>
				<tbody>
					
			        {% for item in emails %}
						<tr>
			        		<td>{{item.id}}</td>
			        		<td>{{item.created_at}}</td>
			        		<td>{{item.status.name}}</td>
			        		<td>{{item.email_to}}</td>
			              	{#<td>{{item.email_cc}}</td>#}
			              	<td>{{item.body}}</td>
			             </tr>
			        {% endfor %} 
		        </tbody>
		       
    </table>
  
{% else %}
<div class="card-body">
	<p>No Items</p>
</div>
{% endif %}
