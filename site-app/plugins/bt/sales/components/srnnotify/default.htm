<div>
    {% for filesmade in Srnnotify.stats  %}
    <div style="float: left; width: 120px; margin: 5px">
        <div class="card" style="border: 2px solid #ccc; background: #fff; border-radius: 2px">
            <div style="height: 140px; overflow: hidden;"><img src="{{filesmade['pic']}}" style="margin: 0px auto; display: block; min-width: 100%; max-height: 100%" alt=""/></div>
            <div class="badge badge-secondary" style="padding: 5px 0px 0px 0px; text-align: center; ">
                <h3 style="font-size: 10px" >{{filesmade["name"]}}</h3>
                <h4 style="font-size: 7px" class="text-white">{{filesmade["date"]}}</h4>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
