# ===================================
#  Form Behavior Config
# ===================================

# Record name
name: Client

# Model Form Field configuration
form: $/bt/sales/models/client/fields.yaml

# Model Class name
modelClass: Bt\Sales\Models\Client

# Default redirect location
defaultRedirect: bt/sales/client

# Create page
create:
    title: Create Client
    redirect: bt/sales/client/update/:id
    redirectClose: bt/sales/client

# Update page
update:
    title: Edit Client
    redirect: bt/sales/client
    redirectClose: bt/sales/client

# Preview page
preview:
    title: Preview Client
