# ===================================
#  Form Behavior Config
# ===================================

# Record name
name: Dispatch Item

# Model Form Field configuration
form: $/bt/sales/models/dispatchitem/fields.yaml

# Model Class name
modelClass: Bt\Sales\Models\DispatchItem

# Default redirect location
defaultRedirect: bt/sales/dispatchitem

# Create page
create:
    title: backend::lang.form.create_title
    redirect: bt/sales/dispatchitem/update/:id
    redirectClose: bt/sales/dispatchitem

# Update page
update:
    title: backend::lang.form.update_title
    redirect: bt/sales/dispatchitem
    redirectClose: bt/sales/dispatchitem

# Preview page
preview:
    title: backend::lang.form.preview_title
