scopes:

    client:
        label: Client Name
        modelClass: Bt\Sales\Models\Client
        conditions: client_id in (:filtered)
        nameFrom: company_name
    date:
        label: Date
        type: daterange
        conditions: date >= ':after' AND date <= ':before'

    reasonforreturn:
        label: Reasons For Returns
        modelClass: Bt\Sales\Models\ReasonForReturn
        conditions: reasonforreturn_id in (:filtered)
        nameFrom: name
    