# ===================================
#  Form Behavior Config
# ===================================

# Record name
name: Discount Item

# Model Form Field configuration
form: $/bt/sales/models/discountitem/fields.yaml

# Model Class name
modelClass: Bt\Sales\Models\DiscountItem

# Default redirect location
defaultRedirect: bt/sales/discountitem

# Create page
create:
    title: backend::lang.form.create_title
    redirect: bt/sales/discountitem/update/:id
    redirectClose: bt/sales/discountitem

# Update page
update:
    title: backend::lang.form.update_title
    redirect: bt/sales/discountitem
    redirectClose: bt/sales/discountitem

# Preview page
preview:
    title: backend::lang.form.preview_title
