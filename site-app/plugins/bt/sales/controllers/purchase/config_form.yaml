# ===================================
#  Form Behavior Config
# ===================================

# Record name
name: Purchase

# Model Form Field configuration
form: $/bt/sales/models/purchase/fields.yaml

# Model Class name
modelClass: Bt\Sales\Models\Purchase

# Default redirect location
defaultRedirect: bt/sales/purchase

# Create page
create:
    title: backend::lang.form.create_title
    redirect: bt/sales/purchase/update/:id
    redirectClose: bt/sales/purchase

# Update page
update:
    title: backend::lang.form.update_title
    redirect: bt/sales/purchase
    redirectClose: bt/sales/purchase

# Preview page
preview:
    title: backend::lang.form.preview_title
