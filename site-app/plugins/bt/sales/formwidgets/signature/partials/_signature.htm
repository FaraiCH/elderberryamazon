<?php if ($this->previewMode): ?>

    <div class="form-control">
            <canvas class="signature" style="height: 20%; width: 20%;"></canvas>
    </div>

<?php else: ?>

    <canvas id="canvas" style="max-width: 100%; border: 1px solid black;"></canvas>

<!-- Modal end here -->


<?php endif ?>

<script>

    $(document).ready(()=>{

        canvas = document.getElementById('canvas');
//canvas.setAttribute('style', 'width:100%;height:100%;position: absolute;');
        if(typeof G_vmlCanvasManager != 'undefined') {
            canvas = G_vmlCanvasManager.initElement(canvas);
        }
        context = canvas.getContext("2d");

        $('[data-target]').click(()=>{
            setTimeout(()=>{
                canvas.setAttribute('height', $(canvasDiv).outerHeight());
                canvas.setAttribute('width', $(canvasDiv).width());
            },601)
        })

        $('#canvas').mousedown(function(e){
            var offset = $(this).offset()
            var mouseX = e.pageX - this.offsetLeft;
            var mouseY = e.pageY - this.offsetTop;

            paint = true;
            addClick(e.pageX - offset.left, e.pageY - offset.top);
            redraw();
        });

        $('#canvas').mousemove(function(e){
            if(paint){
                var offset = $(this).offset()
                //addClick(e.pageX - this.offsetLeft, e.pageY - this.offsetTop, true);
                addClick(e.pageX - offset.left, e.pageY - offset.top,true);
                console.log(e.pageX,offset.left, e.pageY,offset.top);
                redraw();
            }
        });

        $('#canvas').mouseup(function(e){
            paint = false;
        });

        $('#canvas').mouseleave(function(e){
            paint = false;
        });

        var clickX = new Array();
        var clickY = new Array();
        var clickDrag = new Array();
        var paint;

        function addClick(x, y, dragging)
        {
            clickX.push(x);
            clickY.push(y);
            clickDrag.push(dragging);
        }

        function redraw(){
            context.clearRect(0, 0, context.canvas.width, context.canvas.height); // Clears the canvas

            context.strokeStyle = "black";
            context.lineJoin = "round";
            context.lineWidth = 2;

            for(var i=0; i < clickX.length; i++) {
                context.beginPath();
                if(clickDrag[i] && i){
                    context.moveTo(clickX[i-1], clickY[i-1]);
                }else{
                    context.moveTo(clickX[i]-1, clickY[i]);
                }
                context.lineTo(clickX[i], clickY[i]);
                context.closePath();
                context.stroke();
            }
        }
    })
    document.querySelector('button').onclick = function (e) {
        var canvas = document.getElementById('canvas');
        var canvasdata = canvas.toDataURL('image/png');
        $.request('onSupper', {
            data: { fileToLoad: canvasdata },
            success: function(data) {

            }
        });
    };
</script>
