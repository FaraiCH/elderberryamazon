# ===================================
#  Form Field Definitions
# ===================================

fields:
   
    isbtproduct:
        label: Is Wish Item or Catalogue
        type: radio
        span: auto
        options:
            1: Wish Item
            0: Catalogue

    reason_id:
        label: Reason for plan
        type: dropdown 
        placeholder: -- Select ---
        span: auto
        
        

    item:
        label: Production item
        type: dropdown
        # select: concat(id," > ", description )
        span: left
        placeholder: -- Select ---
        trigger:
            action: show
            field: isbtproduct
            condition: 'value[1]'
            required: true

    catitem:
        label: Catalogue item
        type: dropdown
        # select: concat(id," > ", description )
        span: left 
        placeholder: -- Select ---
        trigger:
            action: show
            field: isbtproduct
            condition: 'value[0]'
            required: true
   
    units:
        label: Units To Product
        span: auto 
        type: number
        trigger:
            action: show
            field: isbtproduct
            condition: 'value[0] or value[1]'
            required: true

    schedule_date:
        label: Production Expected Date
        type: datepicker
        mode: date
        span: auto 
        trigger:
            action: show
            field: isbtproduct
            condition: 'value[0] or value[1]'
            required: true

    notes:
        label: Notes to Production and Management
        span: auto 
        type: textarea
        size: small
        trigger:
            action: show
            field: isbtproduct
            condition: 'value[0] or value[1]'
            required: true


    