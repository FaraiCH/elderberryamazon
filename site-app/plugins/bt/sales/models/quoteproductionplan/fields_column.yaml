# ===================================
#  Form Field Definitions
# ===================================

fields:

    quote@create:
        label: Quote Number  
        select: concat(id, ' > ', company_name)
        type: relation
        span: auto
        placeholder: -- select a quote --
        tab: Setup
        # dependsOn:
        #     - schedule 

    quote@update:
        label: Quote Number  
        select: concat(id, ' > ', company_name)
        type: relation
        span: auto 
        placeholder: -- select a quote --
        tab: Setup
        disabled: true
   
    isbtproduct:
        label: Is Wish Item or Catalogue
        type: radio
        span: auto
        disabled: true
        options:
            1: Wish Item
            0: Catalogue

    reason_id:
        label: Reason for plan
        type: dropdown 
        placeholder: -- Select ---
        span: auto
        disabled: true
        
        

    item:
        label: Production item
        type: dropdown
        # select: concat(id," > ", description )
        span: left
        placeholder: -- Select ---
        trigger:
            action: show
            field: isbtproduct
            condition: 'value[1]'
            required: true
        disabled: true
        options: listItems

    catitem:
        label: Catalogue item
        type: dropdown
        # select: concat(id," > ", description )
        span: left 
        placeholder: -- Select ---
        trigger:
            action: show
            field: isbtproduct
            condition: 'value[0]'
            required: true
        disabled: true
        options: listCats
    units:
        label: Units To Product
        span: auto 
        type: number
        trigger:
            action: show
            field: isbtproduct
            condition: 'value[0] or value[1]'
            required: true

    schedule_date:
        label: Production Expected Date
        type: datepicker
        mode: date
        span: auto 
        trigger:
            action: show
            field: isbtproduct
            condition: 'value[0] or value[1]'
            required: true

    notes:
        label: Notes to Production and Management
        span: auto 
        type: textarea
        size: small
        trigger:
            action: show
            field: isbtproduct
            condition: 'value[0] or value[1]'
            required: true


    