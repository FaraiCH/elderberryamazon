# ===================================
#  List Column Definitions
# ===================================

columns:
    run_date:
        label: Run Date
        searchable: true
        type: date
    id:
        label: ID
        searchable: true

    category:
        label: Category
        select: name
        relation: category

    straight:
        label: Straight
        type: number
        format: "%.1f kg"

    coil:
        label: Coil
        type: number
        format: "%.1f kg"

    target:
        label: Target

    
