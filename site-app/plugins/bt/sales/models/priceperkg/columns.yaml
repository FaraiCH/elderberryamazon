# ===================================
#  List Column Definitions
# ===================================

columns:
    id:
        label: ID
        searchable: true
        invisible: true
    amount:
        label: Price Per Kg
        type: number
        format: R %.2f
    created_at:
        label: Date Created
        searchable: true
        invisible: true
    updated_at:
        label: Date Updated
        searchable: true
    # active:
    #     label: Is Active
    #     disabled: false
    createdby:
        label: Create By
        searchable: true
        relation: createdby
        select: concat(first_name, ' ', last_name)
        invisible: true
    updatedby:
        label: Updated By
        searchable: true
        relation: updatedby
        select: concat(first_name, ' ', last_name)

