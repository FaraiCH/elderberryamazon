# ===================================
#  List Column Definitions
# ===================================

columns:

    quote_id:
        label: Quote
        searchable: true
        type: number
    ponumber:
        label: PO Number
        select: ponumber
        relation: quote
        searchable: true
        sortable: false
       

    client:
        label: Client Name
        select: company_name
        relation: quote
        searchable: true
    sales_rep:
        label: Sales Rep
        type: partial
        path: $/bt/production/models/push/_sales_rep.htm
        searchable: false
        sortable: false
    clienttotal:
        label: Quote Inc Vat
        relation: quote
        select: totalincvat
        # type: number
        searchable: false
        # format: "%.1f kg"
        type: partial
        path: $/bt/production/models/push/_currency_column.htm
    Invoiced:
        label: Invoiced
        type: partial
        path: $/bt/sales/models/quotereponse/_paymenttraker.htm
        searchable: false
        sortable: false
        invisible: false
    poamount:
        label: Amount on PO
        # type: number
        searchable: false
        # format: "%.1f kg"
        type: partial
        path: $/bt/plcommon/partials/_currency_column.htm

    def:
        label: Def
        type: partial
        path: $/bt/sales/models/quotereponse/_def_column.htm
        searchable: false
        sortable: false
    
    
    poamountcomment:
        label: PO Amount Comment
        invisible: false
    status:
      label: Status 
      relation: status
      select: name
    
    # response:
    #   label: Comment

    

    files_count:
      label: Att Files 
      relation: file
      # useRelationCount: true
      select: file_name
    created_at:
      label: Date Created
      type: date
