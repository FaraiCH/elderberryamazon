    header4:
        type: section
        label: 3. Truck Departure Details
        cssClass: noezanheader

    vehicle_departure:
        label: Truck Departure Time
        type: datepicker
        tab: Truck Departure Details
        span: auto


    images_truck_finish:
        label: Truck Finish Photos
        type: fileupload
        tab: Truck Departure Details
