# ===================================
#  Form Field Definitions
# ===================================

fields:
    # id:
    #     label: ID
    #     disabled: true
    srn:
        label: Quote Number  
        select: concat(id)
        type: relation
        span: auto
        placeholder: -- select a quote --
    item_id:
        label: Pipe/Product Item
        type: dropdown
        options: listSrnitemsDep
        # comment: Item linked to the production pipes. Only Item passed QC
        placeholder: -- select a Pipe --  
        span: auto
        dependsOn: srn  

    units:
        label: Units
        span: auto
        type: number

    return_date:
        label: Return Date
        type: datepicker
        span: auto
        mode: date
    note:
        label: Reason for return
        type: textarea
        size: small