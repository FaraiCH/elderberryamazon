# ===================================
#  Form Field Definitions
# ===================================

fields:
    user_id:
        label: Account Manager
        span: storm
        type: dropdown
        placeholder: -- Select Account Manager --
        cssClass: col-sm-6 col-md-6
    client_category:
        label: Category
        span: storm
        cssClass: col-sm-6 col-md-6
        placeholder: -- Select Client Category --
        type: relation
        select: name
    account_number:
        label: Account Number
        span: storm
        cssClass: col-sm-6 col-md-6
    document_password:
        label: Document Password
        span: storm
        cssClass: col-sm-6 col-md-6
tabs:
