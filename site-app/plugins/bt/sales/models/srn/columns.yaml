        label: Invoice list
        type: partial
        path: $/bt/sales/models/srn/_invoicelist_column.htm
        searchable: false
        sortable: false
        invisible: true

    type:
        label: Delivery Type
        select: name
        relation: type

    deliveryprice:
        label: Delivery Price
        type: Number
        format: "%.1f kg"
        invisible: false

