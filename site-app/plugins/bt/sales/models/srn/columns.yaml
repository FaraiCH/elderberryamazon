    client:
        label: Client Name
        select: company_name
        relation: client
        searchable: true
    client2:
        label: Contact
        select: contact_name
        relation: client
        invisible: true
        searchable: true
    client3:
        label: Contact Details
        select: concat(contact_name, ' / ',contact_email)
        relation: client
        invisible: true
        searchable: true
    Items:
        label: Items
        useRelationCount: true
        relation: items
    stock_weight:
        label: Stock Weight
        type: partial
        path: $/bt/sales/models/srn/stock_weight.htm
    stock_value:
        label: Stock Value
        type: partial
        path: $/bt/sales/models/srn/stock_value.htm
    stock_value_cat:
        label: Stock Value Catalogue
        type: partial
        path: $/bt/sales/models/srn/stock_value_cat.htm
    amount_nvoived:
        label: Value to Invoice
        type: partial
        path: $/bt/sales/models/srn/amount_nvoiced.htm
    amount:
        label: Invoiced
        type: partial
        path: $/bt/sales/models/srn/amount.htm
    delivery_address:
        label: Delivery Address
    pictures:
        label: Picture Status
        type: partial
        path: $/bt/sales/models/srn/_pictures.htm
    createdby:
        label: Create By
        searchable: true
        relation: createdby
        select: concat(first_name, ' ', last_name)
        invisible: true
    updatedby:
        label: Updated By
        searchable: true
        relation: updatedby
        select: concat(first_name, ' ', last_name)
        invisible: true
    created_at:
