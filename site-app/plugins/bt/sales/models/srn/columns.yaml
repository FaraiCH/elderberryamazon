columns:
    docstatus:
        label: Doc Status
        type: partial
        path: $/bt/sales/models/srn/_docstatus.htm
        searchable: false
        sortable: false
        invisible: false
    active:
        label: Logistics Delivery Status
        type: partial
        path: $/bt/sales/models/srn/_active.htm
        searchable: false
        sortable: false
        invisible: false
    pickslip_id:
        label: Pick Slip ID
