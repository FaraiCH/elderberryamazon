    transportratesdestination:
        label: Destination
        disabled: false
        select: CONCAT(name,' - ', kilometers)
        type: relation
        span: auto
        placeholder: -- select destination --

    active:
        label: Active?
        type: switch
        span: auto
        on: Yes
        off: No
