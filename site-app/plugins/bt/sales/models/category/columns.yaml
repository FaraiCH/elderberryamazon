# ===================================
#  List Column Definitions
# ===================================

columns:
    id:
        label: ID
        searchable: true

    category_name:
        label: Category Name
        searchable: true

    ismanaged:
        label: Is Managed?
        type: switch
        on: Yes
        off: No
        

    createdby:
        label: Created By
        span: left
        searchable: true
        relation: createdby
        select: concat(first_name, ' ', last_name)
    updatedby:
            label: Updated By
            searchable: true
            span: right
            relation: updatedby
            select: concat(first_name, ' ', last_name)