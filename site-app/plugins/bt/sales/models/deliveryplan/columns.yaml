# ===================================
#  List Column Definitions
# ===================================

columns:
    id:
        label: ID
        searchable: true
    schedule_date:
        label: Schedule Delivery Date
        searchable: true
    load_date:
        label: Loading Items Date
    daysleft:
        label: Days Left
        type: partial
        path: $/bt/sales/models/deliveryplan/_daysleft_column.htm
        searchable: false
        sortable: false
    quote_id:
        label: Quote No.

    ponumber:
        label: PO Number
        select: ponumber
        relation: quote
        searchable: true
        sortable: false

    invoiceqt:
        label: Invoice
        type: partial
        path: $/bt/sales/models/deliveryplan/_invoice_column.htm

    type:
        label: Delivery Type
        select: name
        relation: type
    client:
        label: Client Name
        select: company_name
        relation: client
        searchable: true
    client2:
        label: Contact
        select: contact_name
        relation: client
        invisible: true
        searchable: true
    client3:
        label: Contact Details
        select: concat(contact_name, ' / ',contact_email)
        relation: client
        invisible: true
        searchable: true
    notes:
        label: Notes
    address:
        label: Delivery Address
        invisible: true

    createdby:
        label: Created By
        searchable: true
        relation: createdby
        select: concat(first_name, ' ', last_name)
    updatedby:
        label: Updated By
        searchable: true
        relation: updatedby
        select: concat(first_name, ' ', last_name)
        invisible: true
    created_at:
        label: Date Created
        format: d-m-Y
        type: date
        invisible: true
    updated_at:
        label: Date Updated
        format: d-m-Y
        type: date
        invisible: true

