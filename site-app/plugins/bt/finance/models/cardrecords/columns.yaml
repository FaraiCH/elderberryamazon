# ===================================
#  List Column Definitions
# ===================================

columns:
    id:
        label: ID
        searchable: true
    project:
        label: Project
        relation: project
        select: name
    
    storename:
        label: Storename/Supplier Name
        searchable: true
    purchase_date:
        label: Date
        searchable: false
        type: partial
        path: $/bt/finance/models/requisition/_nowrap_column.htm

    amount:
        label: Amount
        searchable: false
        type: partial
        path: $/bt/finance/models/requisition/_currency_column.htm
        sortable: true
    mainitem:
        label: Main Item
        searchable: true

    files_count:
      label: No. Requisition 
      relation: signed_requisition
      useRelationCount: true
    files_count_slips:
      label: No. Petty Cash Slips
      relation: slips
      useRelationCount: true
    
    comments:
        label: Comments
        invisible: true
        searchable: true
        sortable: false
    purchasedby:
        label: Purchased By
        relation: purchasedby
        select: concat(name, ' ', surname)
    approvedby:
        label: Approved  By
        relation: approvedby
        select: concat(name, ' ', surname)
    createdby:
        label: Created By
        searchable: true
        relation: createdby
        select: concat(first_name, ' ', last_name)
        invisible: true
    updatedby:
        label: Updated By
        searchable: true
        relation: updatedby
        select: concat(first_name, ' ', last_name)
        invisible: true
    created_at:
        label: Date Created
        format: d-m-Y
        type: date
        invisible: true
    updated_at:
        label: Date Updated
        format: d-m-Y
        type: date
        invisible: true