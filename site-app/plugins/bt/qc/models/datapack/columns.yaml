# ===================================
#  List Column Definitions
# ===================================

columns:
    id:
        label: ID
        searchable: true
    name:
        label: Document Name
        searchable: true
        span: left


    quote_id:
        label: Quote

    item:
        label: Quote Item
        relation: item
        searchable: true
        select: concat('#',id, ' > ', description)
    summary:
        label: Document Summary
        searchable: true
        span: right
    createdby:
        label: Create By
        searchable: true
        relation: createdby
        select: concat(first_name, ' ', last_name)
        invisible: false
    updatedby:
        label: Updated By
        searchable: true
        relation: updatedby
        select: concat(first_name, ' ', last_name)
        invisible: true
    created_at:
        label: Date Created
        format: d-m-Y
        type: date
        invisible: false
    updated_at:
        label: Date Updated
        format: d-m-Y
        type: date
        invisible: true
