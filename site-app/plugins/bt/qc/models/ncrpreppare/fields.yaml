fields:
    status_id:
      label: Prepared by
      type: switch
      on: Yes
      off: No
      span: auto
    createdby:
      label: Created By
      disabled: true
      type: relation
      select: concat(first_name, ' ', last_name)
      span: auto
      placeholder: -- select a status --
      comment: Please ignore, this field will be automated
