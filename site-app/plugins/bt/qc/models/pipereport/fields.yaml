# ===================================
#  Form Field Definitions
# ===================================

fields:
    # id:
    #     label: ID
    #     disabled: true
    date:
        label: Date
        disabled: false
        type: datepicker
        span: left
    quote:
        label: Quote Number
        select: concat(id, " > ",company_name)
        type: relation
        span: auto
        placeholder: -- select a quote --
    item_id:
        label: Pipe Description
        type: dropdown
        dependsOn: quote
        span: auto
        placeholder: -- select a Item --
    supplier_batch:
        label: Batch To Link
        type: dropdown
        dependsOn: item_id
        span: auto
        placeholder: -- Select Batch --

tabs:
    fields:
        datapack@update:
          path: $/bt/qc/controllers/pipereport/_datapack.htm
