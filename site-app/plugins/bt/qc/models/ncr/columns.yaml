# ===================================
#  List Column Definitions
# ===================================

columns:
    id:
        label: ID
        searchable: true
    type:
        label: type
        select: name
        relation: type
        
    customer_name:
      label: Customer Name
      searchable: true
    issue_date:
        label: Issue Date

    product_name:
      label: Product Name
      searchable: true
    quote_id:
        label: Quote Number  
    isresolved:
        label: Is Resolved? 
        type: partial
        path: $/bt/sales/models/srn/_active.htm     
       
    department:
        label: Department
        select: name
        relation: department

    createdby:
        label: Create By
        searchable: true
        relation: createdby
        select: concat(first_name, ' ', last_name)
        invisible: true
    updatedby:
        label: Updated By
        searchable: true
        relation: updatedby
        select: concat(first_name, ' ', last_name)
        invisible: true
    created_at:
        label: Date Created
        format: d-m-Y
        type: date
        invisible: true
    updated_at:
        label: Date Updated
        format: d-m-Y
        type: date
        invisible: true