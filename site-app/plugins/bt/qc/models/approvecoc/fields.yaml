# ===================================
#  Form Field Definitions
# ===================================

fields:
    status_id:
      label: Approve Head Office
      type: switch
      comment: Approve by management
      on: Yes
      off: No
      span: auto
    createdby:
      label: Created By
      disabled: true
      type: relation
      select: concat(first_name, ' ', last_name)
      span: auto
      placeholder: -- select a status --
      comment: Please ignore, this field will be automated
   
    updatedby:
      label: Updated By
      disabled: true
      type: relation
      select: concat(first_name, ' ', last_name)
      span: auto
      placeholder: -- select a status --
      comment: Please ignore, this field will be automated
    note: 
      label: Notes and Comments
      size: small
      type: textarea
      span: auto