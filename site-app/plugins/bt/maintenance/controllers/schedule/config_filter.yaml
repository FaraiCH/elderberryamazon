scopes:
    btline:
        label: Plant Item
        modelClass: Bt\Maintenance\Models\Department
        conditions: line_id in (:filtered)
        nameFrom: name

    assignedto:
        label: Assigned To
        modelClass: Bt\Maintenance\Models\Staff
        conditions: assignedto_id in (:filtered)
        nameFrom: name

    status:
        label: Status
        modelClass: Bt\Maintenance\Models\Status
        conditions: status_id in (:filtered)
        nameFrom: name

    scheduledate:
        label:  Schedule Date
        type: daterange
        conditions: scheduledate >= ':after' AND scheduledate <= ':before'