# ===================================
#  List Column Definitions
# ===================================

columns:
    name:
        label: Check Point
        searchable: true
    orderby:
        label: Order By
        type: number
    createdby:
        label: Create By
        searchable: true
        relation: createdby
        select: concat(first_name, ' ', last_name)
    updatedby:
        label: Updated By
        searchable: true
        relation: updatedby
        select: concat(first_name, ' ', last_name)
