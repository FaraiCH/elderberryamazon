# ===================================
#  List Column Definitions
# ===================================

columns:
    id:
        label: ID
        searchable: true
    readingdate:
        label: Reading Date
    reading:
        label: Readings
        type: number
        format:  %.2f kwH

    pfl1:
        label: pfl1
        type: number
        format:  %.2f kwH

    pfl2:
        label: pfl2
        type: number
        format:  %.2f kwH

    pfl3:
        label: pfl3
        type: number
        format:  %.2f kwH
    meltblown:
        label: meltblown
        type: number
        format:  %.2f kwH
    notes:
        label: Notes
    createdby:
        label: Create By
        searchable: true
        relation: createdby
        select: concat(first_name, ' ', last_name)
    updatedby:
        label: Updated By
        searchable: true
        relation: updatedby
        select: concat(first_name, ' ', last_name)
