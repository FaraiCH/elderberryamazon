# ===================================
#  Form Field Definitions
# ===================================

fields:


    name:
        label: Company Name
        span: auto
    vendor_type:
        label: Category
        span: auto
        type: relation
        select: name
        placeholder: --- Select ---
    country:
        label: Country
        span: auto
        type: relation
        select: name
        placeholder: --- Select ---
    city:
            label: City
            span: auto
    vatno:
        label: VAT No
        span: auto

    coreg:
        label: CO Reg
        span: auto
    website:
        label: Website
        tab: Contact Details
        span: auto
    welike:
        label: Good Standing
        span: auto
        type: dropdown
        options:
            1: Yes
            0: No
    risklevel_id:
        label: Risk Left
        span: auto
        type: dropdown
        options:
            5: Excellent
            4: Above Average
            3: Average
            2: Below Average
            1: Very Poor
            0: None Existent

