# ===================================
#  Form Behavior Config
# ===================================

# Record name
name: Category

# Model Form Field configuration
form: $/bt/suppliers/models/category/fields.yaml

# Model Class name
modelClass: Bt\Suppliers\Models\Category

# Default redirect location
defaultRedirect: bt/suppliers/category

# Create page
create:
    title: backend::lang.form.create_title
    redirect: bt/suppliers/category/update/:id
    redirectClose: bt/suppliers/category

# Update page
update:
    title: backend::lang.form.update_title
    redirect: bt/suppliers/category
    redirectClose: bt/suppliers/category

# Preview page
preview:
    title: backend::lang.form.preview_title
