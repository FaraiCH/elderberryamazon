# ===================================
#  Form Behavior Config
# ===================================

# Record name
name: Vendor

# Model Form Field configuration
form: $/bt/suppliers/models/vendor/fields.yaml

# Model Class name
modelClass: Bt\Suppliers\Models\Vendor

# Default redirect location
defaultRedirect: bt/suppliers/vendor

# Create page
create:
    title: backend::lang.form.create_title
    redirect: bt/suppliers/vendor/update/:id
    redirectClose: bt/suppliers/vendor

# Update page
update:
    title: backend::lang.form.update_title
    redirect: bt/suppliers/vendor
    redirectClose: bt/suppliers/vendor

# Preview page
preview:
    title: backend::lang.form.preview_title
