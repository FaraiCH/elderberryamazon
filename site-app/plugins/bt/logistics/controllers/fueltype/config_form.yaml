    redirectClose: bt/logistics/fueltype

# Update page
update:
    title: backend::lang.form.update_title
    redirect: bt/logistics/fueltype
    redirectClose: bt/logistics/fueltype

# Preview page
preview:
    title: backend::lang.form.preview_title
